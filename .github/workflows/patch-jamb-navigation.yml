name: One-time JAMB navigation patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-jamb-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch MainLayout navigation
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/components/layout/MainLayout.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          admin_anchor = "  { label: 'Dashboard', icon: LayoutDashboard, path: '/admin/dashboard', roles: ['admin', 'super_admin', 'director', 'finance'] },\n"
          admin_insert = admin_anchor + "  { label: 'JAMB CBT', icon: ClipboardCheck, path: '#', roles: ['admin', 'super_admin', 'director'], children: [\n      { label: 'JAMB Analytics', icon: BarChart3, path: '/admin/jamb-cbt', roles: ['admin', 'super_admin', 'director'] },\n      { label: 'Question Bank', icon: BookOpen, path: '/admin/jamb-cbt/questions', roles: ['admin', 'super_admin', 'director'] },\n    ] },\n"
          if "label: 'JAMB CBT'" not in text:
              if admin_anchor not in text:
                  raise SystemExit('Admin navigation anchor not found')
              text = text.replace(admin_anchor, admin_insert, 1)

          student_anchor = "  { label: 'My Profile', icon: User, path: '/student/profile', roles: ['student'] },\n"
          student_insert = student_anchor + "  { label: 'JAMB CBT', icon: ClipboardCheck, path: '/student/jamb-cbt', roles: ['student'], badge: 'New' },\n"
          if "path: '/student/jamb-cbt'" not in text:
              if student_anchor not in text:
                  raise SystemExit('Student navigation anchor not found')
              text = text.replace(student_anchor, student_insert, 1)

          parent_anchor = "  { label: 'My Children', icon: Users, path: '/parent/children', roles: ['parent'] },\n"
          parent_insert = parent_anchor + "  { label: 'JAMB CBT', icon: ClipboardCheck, path: '/parent/jamb-cbt', roles: ['parent'], badge: 'New' },\n"
          if "path: '/parent/jamb-cbt'" not in text:
              if parent_anchor not in text:
                  raise SystemExit('Parent navigation anchor not found')
              text = text.replace(parent_anchor, parent_insert, 1)

          teacher_anchor = "  { label: 'Timetable', icon: Calendar, path: '/teacher/timetable', roles: ['teacher'] },\n"
          teacher_insert = teacher_anchor + "  { label: 'JAMB CBT', icon: ClipboardCheck, path: '/teacher/jamb-cbt', roles: ['teacher'] },\n"
          if "path: '/teacher/jamb-cbt'" not in text:
              if teacher_anchor not in text:
                  raise SystemExit('Teacher navigation anchor not found')
              text = text.replace(teacher_anchor, teacher_insert, 1)

          # Mobile dock navigation.
          student_dock_anchor = "      { label: 'My Profile', icon: User, path: '/student/profile', roles: ['student'] },\n"
          student_dock_insert = student_dock_anchor + "      { label: 'JAMB CBT', icon: ClipboardCheck, path: '/student/jamb-cbt', roles: ['student'], badge: 'New' },\n"
          if "{ label: 'JAMB CBT', icon: ClipboardCheck, path: '/student/jamb-cbt'" not in text:
              text = text.replace(student_dock_anchor, student_dock_insert, 1)

          parent_dock_anchor = "      { label: 'My Children', icon: Users, path: '/parent/children', roles: ['parent'] },\n"
          parent_dock_insert = parent_dock_anchor + "      { label: 'JAMB CBT', icon: ClipboardCheck, path: '/parent/jamb-cbt', roles: ['parent'], badge: 'New' },\n"
          # Only insert into dock if the exact dock anchor remains after the main navigation replacement.
          occurrences = text.count(parent_dock_anchor)
          if occurrences >= 1 and text.count("{ label: 'JAMB CBT', icon: ClipboardCheck, path: '/parent/jamb-cbt'") < 2:
              text = text.replace(parent_dock_anchor, parent_dock_insert, 1)

          if text == original:
              print('No navigation changes were necessary.')
          else:
              path.write_text(text, encoding='utf-8')
              print('MainLayout JAMB navigation patched.')
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/layout/MainLayout.tsx
          rm -f .github/workflows/patch-jamb-navigation.yml
          git add .github/workflows/patch-jamb-navigation.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: add JAMB CBT navigation to role sidebars"
          git push origin main
